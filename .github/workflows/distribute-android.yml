name: Distribute Android to Firebase App Distribution

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Release notes shown to testers (defaults to the commit message)'
        required: false
      photo_hero:
        description: 'Build with the photo-hero screens on (PHOTO_HERO_UI). On when ticked here OR when the PHOTO_HERO_UI repository variable is true (pushes to main follow the variable).'
        type: boolean
        required: false
        default: false
      photo_footer:
        description: 'Build with the photo footer band on (PHOTO_FOOTER_UI). On when ticked here OR when the PHOTO_FOOTER_UI repository variable is true. Takes effect only with the photo hero on too.'
        type: boolean
        required: false
        default: false
      hero_images_remote:
        description: 'Tester build that reads admin-published app photos (HERO_IMAGES_REMOTE). Takes effect only with photo_hero ticked too. Manual runs only; pushes to main always build with it off.'
        type: boolean
        required: false
        default: false
      partner_media:
        description: 'Tester build with the partner home photo and logo (PARTNER_MEDIA_UI). Takes effect only with photo_hero ticked too, and the server needs PARTNER_MEDIA on. Manual runs only; pushes to main always build with it off.'
        type: boolean
        required: false
        default: false

concurrency:
  group: android-distribution
  cancel-in-progress: false

permissions:
  contents: read
  # To delete older APK artifacts, so only the latest build is stored.
  actions: write

env:
  FIREBASE_ANDROID_APP_ID: '1:318978253903:android:be3d05f90368b60545f63a'

jobs:
  distribute:
    name: Build signed release APK and distribute
    runs-on: ubuntu-latest

    env:
      API_BASE: ${{ vars.API_BASE || 'https://fitflex-faas.bfast.smartstock.co.tz' }}
      # Shop home V2 (on/off). Set repo variable SHOP_HOME_V2=true to switch it on;
      # the server also needs SHOP_HOME_V2=1, otherwise the app falls back to today's shop.
      SHOP_HOME_V2: ${{ vars.SHOP_HOME_V2 || 'false' }}
      # Photo hero (PHOTO_HERO_UI): on when a manual run ticks photo_hero OR the
      # PHOTO_HERO_UI repository variable is true; off otherwise. With it on,
      # the release guard runs before the build (no test-only hero photo may
      # ship; kTestOnlyHeroAssets, assets/photos/hero/LICENSES.md).
      PHOTO_HERO_UI: ${{ (github.event_name == 'workflow_dispatch' && inputs.photo_hero) && 'true' || vars.PHOTO_HERO_UI || 'false' }}
      # Photo footer (PHOTO_FOOTER_UI): the same rule (photo_footer input OR the
      # PHOTO_FOOTER_UI variable); the app ignores it unless PHOTO_HERO_UI is on.
      PHOTO_FOOTER_UI: ${{ (github.event_name == 'workflow_dispatch' && inputs.photo_footer) && 'true' || vars.PHOTO_FOOTER_UI || 'false' }}
      # Admin-published app photos (HERO_IMAGES_REMOTE): manual runs with
      # hero_images_remote ticked only (no repository variable); the app
      # ignores it unless PHOTO_HERO_UI is on as well.
      HERO_IMAGES_REMOTE: ${{ github.event_name == 'workflow_dispatch' && inputs.hero_images_remote && 'true' || 'false' }}
      # Partner home photo and logo (PARTNER_MEDIA_UI): manual runs with
      # partner_media ticked only (no repository variable); the app ignores
      # it unless PHOTO_HERO_UI is on as well.
      PARTNER_MEDIA_UI: ${{ github.event_name == 'workflow_dispatch' && inputs.partner_media && 'true' || 'false' }}
      # Hosts the /storage photo addresses may redirect to (the backend's
      # ZEBRA_BASE_URL host), comma-separated. Empty: only the API host, so
      # every redirected photo falls back to the bundled one.
      HERO_IMAGES_ALLOWED_HOSTS: ${{ vars.HERO_IMAGES_ALLOWED_HOSTS || '' }}
      # Comma-separated App Distribution group aliases (Firebase console →
      # App Distribution → Testers & Groups).
      TESTER_GROUPS: ${{ vars.FIREBASE_TESTER_GROUPS || 'testers' }}
      APK: build/app/outputs/flutter-apk/app-release.apk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Gradle 8.14 cannot read Java 25, which ubuntu-latest (now 26.04) ships
      # by default. The app compiles for Java 17, so pin it, as the Play Store
      # release workflow already does.
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # pubspec.yaml requires Dart ^3.10.8, i.e. Flutter 3.38 or newer.
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true

      # One setup step:
      # - .env (bundled asset) and google-services.json are gitignored.
      # - Every distributed build must be signed with the same key, or testers
      #   cannot install a new build over the previous one (the runner's debug
      #   key is random per run). This is the App Distribution-only key from
      #   scripts/create_distribution_keystore.sh, NOT the Play upload key.
      # - android/gradle.properties asks for an 8 GB heap; runners have ~7 GB,
      #   so R8 swaps for 30+ minutes. User-level gradle.properties overrides
      #   the project value on CI only.
      - name: Prepare build (config, signing key, Gradle memory)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_DIST_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_DIST_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_DIST_KEY_ALIAS || 'fitflex-distribution' }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::Secret GOOGLE_SERVICES_JSON is not set."
            exit 1
          fi
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Run scripts/create_distribution_keystore.sh to create the ANDROID_DIST_* signing secrets."
            exit 1
          fi
          echo "API_BASE=$API_BASE" > .env
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          echo "$KEYSTORE_BASE64" | base64 --decode > android/fitflex-distribution.jks
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=../fitflex-distribution.jks"
          } > android/key.properties
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError" >> ~/.gradle/gradle.properties

      # Photo heroes (PHOTO_HERO_UI) shown to users: no test-only hero photo
      # may ship (kTestOnlyHeroAssets, assets/photos/hero/LICENSES.md). This
      # fails the job, before anything is built, if one is still bundled.
      - name: Photo hero release guard
        if: env.PHOTO_HERO_UI == 'true'
        run: |
          flutter pub get
          flutter test test/photo_hero_release_guard_test.dart --dart-define=PHOTO_HERO_UI=true --dart-define=PHOTO_HERO_RELEASE=true

      # versionCode must increase with every build testers install; offset the
      # run number past the pubspec build number (+2).
      - name: Build release APK
        run: |
          flutter pub get
          flutter build apk --release \
            --build-number=$((100 + ${{ github.run_number }})) \
            --dart-define=API_BASE="$API_BASE" --dart-define=SHOP_HOME_V2="$SHOP_HOME_V2" --dart-define=PHOTO_HERO_UI="$PHOTO_HERO_UI" --dart-define=PHOTO_FOOTER_UI="$PHOTO_FOOTER_UI" --dart-define=HERO_IMAGES_REMOTE="$HERO_IMAGES_REMOTE" --dart-define=HERO_IMAGES_ALLOWED_HOSTS="$HERO_IMAGES_ALLOWED_HOSTS" --dart-define=PARTNER_MEDIA_UI="$PARTNER_MEDIA_UI"

      # Testers first: nothing after this may stop a build reaching them.
      - name: Distribute to testers
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FITFLEX_AF_PILOT }}
          NOTES: ${{ github.event.inputs.release_notes || github.event.head_commit.message || 'Manual build' }}
        run: |
          printf '%s' "$FIREBASE_SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@latest appdistribution:distribute "$APK" \
            --app "$FIREBASE_ANDROID_APP_ID" \
            --groups "$TESTER_GROUPS" \
            --release-notes "$(printf '%s' "$NOTES" | head -c 2000) (build ${{ github.run_number }}, ${GITHUB_SHA::7})"
          rm -f "$RUNNER_TEMP/sa.json"

      # Keep one APK in GitHub storage: delete every older APK artifact
      # (release or debug, from any run) before storing this build's. This is
      # what keeps the repository under its artifact storage quota.
      - name: Delete older APK artifacts
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name | test("apk"; "i")) | .id' |
          while read -r id; do
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" && echo "deleted artifact $id"
          done

      # The latest build, downloadable from this run for a few days. Never
      # blocks the release: testers already have it from App Distribution.
      - name: Keep this APK (latest only)
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: fitflex-release-apk
          path: ${{ env.APK }}
          retention-days: 7
